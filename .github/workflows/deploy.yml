# main への push でNode/R検証 → ビルド → GitHub Pages へデプロイする。
# base branchを問わずpull requestでは検証とビルドだけを行い、デプロイしない。
# workflow_dispatchは検証専用で、Pagesへの公開はmainへのpushだけに限定する。
# 事前条件(初回のみ手動): リポジトリ Settings → Pages → Source を「GitHub Actions」にする
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch:

# デプロイは直列化して中断せず、同じPRの古い検証runだけを中断する
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:excel-samples
      - run: npm run test:step1-bundle
      - run: npm run test:step1-transfer-observation-pack
      - run: npm run test:step2-samples
      - run: npm run test:step2-content
      - run: npm run test:step2-assessments
      - run: npm run test:step2-observation-pack
      - run: npm run gate:step2-observation:status
      - run: npm run gate:step1-transfer:status
      - run: npm run gate:stan-release:status
      - run: npm run build
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  r-verify:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: "4.6.1"
      - run: Rscript scripts/install-r-dependencies.R
      - run: Rscript scripts/verify-file-io.R
      - run: Rscript scripts/verify-notebook.R
      - run: Rscript scripts/verify-step1-analysis.R
      - run: Rscript scripts/verify-step1-transfer.R
      - run: Rscript scripts/verify-step1-transfer-observation-rehearsal.R
      - run: Rscript scripts/verify-step2-descriptive.R
      - run: Rscript scripts/verify-step2-condition-plot.R
      - run: Rscript scripts/verify-step2-participant-differences.R
      - run: Rscript scripts/verify-step2-report-and-transfer.R
      - run: Rscript scripts/verify-step2-observation-rehearsal.R
      - run: Rscript scripts/verify-stan-link-lab.R
      - run: node scripts/r-example-verifier.mjs

  stan-verify:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: "4.6.1"
      - name: Configure CmdStan paths
        run: |
          echo "LEARNING_STAN_CMDSTAN_ROOT=${RUNNER_TEMP}/cmdstan" >> "${GITHUB_ENV}"
          echo "LEARNING_STAN_CMDSTAN=${RUNNER_TEMP}/cmdstan/cmdstan-2.39.0" >> "${GITHUB_ENV}"
          echo "LEARNING_STAN_STANC=${RUNNER_TEMP}/cmdstan/cmdstan-2.39.0/bin/stanc" >> "${GITHUB_ENV}"
      - run: Rscript scripts/install-stan-ci.R
      - run: npm run test:stan-syntax-errors
      - run: npm run test:stan-model-review
      - run: npm run test:stan-retention
      - run: npm run test:stan-existing-runtime
      - run: npm run test:stan-reparameterization-runtime

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, r-verify, stan-verify]
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

# main への push でNode/R検証 → ビルド → GitHub Pages へデプロイする。
# base branchを問わずpull requestでは検証とビルドだけを行い、デプロイしない。
# workflow_dispatchは検証専用で、Pagesへの公開はmainへのpushだけに限定する。
# 事前条件(初回のみ手動): リポジトリ Settings → Pages → Source を「GitHub Actions」にする
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch:

# デプロイは直列化して中断せず、同じPRの古い検証runだけを中断する
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:excel-samples
      - run: npm run test:step1-bundle
      - run: npm run test:step1-transfer-observation-pack
      - run: npm run test:step2-samples
      - run: npm run test:step2-content
      - run: npm run test:step2-assessments
      - run: npm run gate:step1-transfer:status
      - run: npm run gate:stan-release:status
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run gate:stan-release:require-pass
      - run: npm run test:research-case-bundle
      - run: npm run build
      - run: npm run audit:stan-public-scope
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  r-verify:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: "4.6.1"
      - run: Rscript scripts/install-r-dependencies.R
      - run: Rscript scripts/verify-file-io.R
      - run: Rscript scripts/verify-notebook.R
      - run: Rscript scripts/verify-step1-analysis.R
      - run: Rscript scripts/verify-step1-transfer.R
      - run: Rscript scripts/verify-step1-transfer-observation-rehearsal.R
      - run: Rscript scripts/verify-step2-descriptive.R
      - run: Rscript scripts/verify-step2-condition-plot.R
      - run: Rscript scripts/verify-step2-participant-differences.R
      - run: Rscript scripts/verify-step2-report-and-transfer.R
      - run: npm run test:step5-data
      - run: npm run test:research-case
      - run: npm run test:bayes-methods-r-syntax
      - run: Rscript scripts/verify-stan-link-lab.R
      - run: node scripts/r-example-verifier.mjs

  stan-verify:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: "4.6.1"
      - name: Configure CmdStan paths
        run: |
          echo "LEARNING_STAN_CMDSTAN_ROOT=${RUNNER_TEMP}/cmdstan" >> "${GITHUB_ENV}"
          echo "LEARNING_STAN_CMDSTAN=${RUNNER_TEMP}/cmdstan/cmdstan-2.39.0" >> "${GITHUB_ENV}"
          echo "LEARNING_STAN_STANC=${RUNNER_TEMP}/cmdstan/cmdstan-2.39.0/bin/stanc" >> "${GITHUB_ENV}"
      - run: Rscript scripts/install-stan-ci.R
      - run: npm run test:stan-syntax-errors
      - run: npm run test:stan-model-review
      - run: npm run test:stan-retention
      - run: npm run test:stan-existing-runtime
      - run: npm run test:stan-reparameterization-runtime

  brms-verify:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: "4.6.1"
      - name: Configure reference CmdStan paths
        run: |
          echo "LEARNING_STAN_CMDSTAN_ROOT=${RUNNER_TEMP}/brms-cmdstan" >> "${GITHUB_ENV}"
          echo "LEARNING_STAN_CMDSTAN=${RUNNER_TEMP}/brms-cmdstan/cmdstan-2.39.0" >> "${GITHUB_ENV}"
      - name: Restore reference R packages (not minimum versions)
        run: |
          Rscript --vanilla -e 'install.packages("renv", repos="https://cloud.r-project.org"); renv::restore(lockfile="reproducibility/renv.lock", library=.libPaths()[1], prompt=FALSE)'
      - run: Rscript --vanilla scripts/install-stan-ci.R
      - name: NB5 clean-session smoke on PR, full on release/manual run
        env:
          EVENT_NAME: ${{ github.event_name }}
          LEARNING_STAN_OUTPUT: ${{ runner.temp }}/nb5
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            Rscript --vanilla scripts/verify-brms-notebook.R --smoke
          else
            Rscript --vanilla scripts/verify-brms-notebook.R
          fi
      - name: Crossed case and matching hand Stan
        working-directory: public/practice/research-case
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            LEARNING_STAN_OUTPUT="$RUNNER_TEMP/crossed" Rscript --vanilla run.R --smoke
            LEARNING_STAN_OUTPUT="$RUNNER_TEMP/equivalence" Rscript --vanilla equivalence.R --smoke
          else
            LEARNING_STAN_OUTPUT="$RUNNER_TEMP/crossed" Rscript --vanilla run.R
            LEARNING_STAN_OUTPUT="$RUNNER_TEMP/equivalence" Rscript --vanilla equivalence.R
          fi
      - run: Rscript --vanilla scripts/verify-research-case-outputs.R "$RUNNER_TEMP/crossed"
      - name: Observation-process full run (release/manual only)
        if: github.event_name != 'pull_request'
        working-directory: public/practice/research-case
        env:
          LEARNING_STAN_OUTPUT: ${{ runner.temp }}/observation
        run: Rscript --vanilla observation.R
      - name: Design simulation execution check (not performance evidence)
        working-directory: public/practice/research-case
        env:
          LEARNING_STAN_OUTPUT: ${{ runner.temp }}/design-smoke
        run: Rscript --vanilla design.R --smoke
      - name: Identifiability comparison
        working-directory: public/practice/research-case
        env:
          LEARNING_STAN_OUTPUT: ${{ runner.temp }}/identifiability
        run: Rscript --vanilla identifiability.R

      - name: Preserve diagnostics and outputs for this tested commit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: brms-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/nb5
            ${{ runner.temp }}/crossed
            ${{ runner.temp }}/equivalence
            ${{ runner.temp }}/observation
            ${{ runner.temp }}/design-smoke
            ${{ runner.temp }}/identifiability

  brms-compatibility:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: "4.6.1"
      - name: Configure compatibility CmdStan paths
        run: |
          echo "LEARNING_STAN_CMDSTAN_ROOT=${RUNNER_TEMP}/compatible-cmdstan" >> "${GITHUB_ENV}"
          echo "LEARNING_STAN_CMDSTAN=${RUNNER_TEMP}/compatible-cmdstan/cmdstan-2.39.0" >> "${GITHUB_ENV}"
          echo "LEARNING_STAN_OUTPUT=${RUNNER_TEMP}/compatible-nb5" >> "${GITHUB_ENV}"
      - run: Rscript --vanilla scripts/install-r-dependencies.R
      - run: Rscript --vanilla -e 'install.packages("brms", repos="https://cloud.r-project.org")'
      - run: Rscript --vanilla scripts/install-stan-ci.R
      - run: Rscript --vanilla scripts/verify-brms-notebook.R

      - name: Preserve compatibility result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: brms-compatibility-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: ${{ runner.temp }}/compatible-nb5

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, r-verify, stan-verify, brms-verify]
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
